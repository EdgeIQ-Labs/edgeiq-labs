services:
  phishsim-manager:
    build: .
    container_name: phishsim-manager
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/phishsim-data:/data
    environment:
      - PORT=3100
      - PHISHSIM_SECRET=${PHISHSIM_SECRET}
      - DATA_DIR=/data
      - BASE_PORT=8200
      - PUBLIC_IP=100.33.233.11
      - TRAEFIK_NETWORK=t3_proxy
    networks:
      - t3_proxy
    labels:
      - "traefik.enable=true"
      # HTTPS router (port 444)
      - "traefik.http.routers.phishsim-api-rtr.rule=Host(`phishsim-api.edgeiqlabs.com`)"
      - "traefik.http.routers.phishsim-api-rtr.entrypoints=websecure-external"
      - "traefik.http.routers.phishsim-api-rtr.tls.certresolver=dns-cloudflare"
      # HTTP router (port 80) — no TLS, for tunnel traffic
      - "traefik.http.routers.phishsim-api-http.rule=Host(`phishsim-api.edgeiqlabs.com`)"
      - "traefik.http.routers.phishsim-api-http.entrypoints=web"
      - "traefik.http.services.phishsim-api-svc.loadbalancer.server.port=3100"

networks:
  t3_proxy:
    external: true
