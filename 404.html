<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Page not found — EdgeIQ Labs</title>
  <meta name="description" content="That EdgeIQ Labs page could not be found. Start again from the homepage, tools, pricing, or contact page." />
  <link rel="canonical" href="https://edgeiqlabs.com/404.html" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <script src="/js/theme.js"></script>
  <style>
    .nf-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
    .nf-card{max-width:720px;width:100%;background:var(--card,#111720);border:1px solid var(--border,#1e2a38);border-radius:16px;padding:40px 32px;text-align:center;}
    .nf-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:3rem;font-weight:800;color:#3dd9ff;letter-spacing:-0.04em;margin-bottom:8px;}
    .nf-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
    .nf-links a{display:inline-block;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:600;}
    .nf-primary{background:#3dd9ff;color:#07121c;}
    .nf-secondary{border:1px solid var(--border,#1e2a38);color:var(--text,#e2e8f0);}
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1>That page is not here.</h1>
      <p style="color:var(--muted,#64748b);line-height:1.6;margin-top:12px;">
        The link may be old, or the page may have moved. Nothing was charged and no action was taken.
      </p>
      <div class="nf-links">
        <a class="nf-primary" href="/">Homepage</a>
        <a class="nf-secondary" href="/tools/">Free tools</a>
        <a class="nf-secondary" href="/pricing/">Pricing</a>
        <a class="nf-secondary" href="/contact/">Contact</a>
      </div>
      <p style="color:var(--muted,#64748b);font-size:0.85rem;margin-top:24px;">
        Need a hand? Email <a href="mailto:support@edgeiqlabs.com" style="color:#3dd9ff;">support@edgeiqlabs.com</a>.
      </p>
    </div>
  </main>
</body>
</html>
