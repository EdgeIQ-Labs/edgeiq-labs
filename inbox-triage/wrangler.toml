name = "inbox-triage"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "inbox-triage"
database_id = "PLACEHOLDER_D1_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "PLACEHOLDER_KV_ID"

[[r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "inbox-triage-kb"

[triggers]
crons = ["0 0 1 * *"]

[dev]
port = 8787
local_protocol = "http"
